spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: gradefront

  datasource:
    url: jdbc:mysql://localhost:3306/gradefront
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

openai:
  api-key: ${OPENAI_API_KEY}